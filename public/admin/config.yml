local_backend: true

backend:
  name: github
  repo: trazer-creations/astro-site
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog" # Where Decap saves the Markdown files
    extension: "md"
    format: "frontmatter"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }