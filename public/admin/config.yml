local_backend: true

backend:
  name: github
  repo: trazer-creations/astro-site
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "src/content/products"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Product Name"
        name: "title"
        widget: "string"

      - label: "Price"
        name: "price"
        widget: "number"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Image"
        name: "image"
        widget: "image"

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
